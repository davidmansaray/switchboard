name: Application checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/switchboard_showcase_dev
      DATABASE_URL_DIRECT: postgres://postgres@localhost:5432/switchboard_showcase_dev
      MASTRA_DATABASE_URL: postgres://postgres@localhost:5432/switchboard_showcase_dev
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/switchboard_showcase_test
      E2E_DATABASE_URL: postgres://postgres@localhost:5432/switchboard_showcase_e2e
      LLM_MODE: scripted
      PGHOST: localhost
      PGUSER: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: |
          npm install --global pnpm@10.30.3
          pnpm install --frozen-lockfile
          pnpm setup:local
          pnpm db:create
          pnpm db:reset
      - name: Lint and types
        run: pnpm lint && pnpm typecheck
      - name: Unit and integration tests
        run: pnpm test && pnpm test:app
      - name: Deterministic evaluations and recorded replay
        run: pnpm eval && pnpm eval:app && EVAL_REQUIRE_RECORDINGS=true pnpm eval:replay
      - name: Production builds
        run: pnpm build
      - name: Browser story on both signal backends
        run: pnpm e2e
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-failure-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
